<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إطلاق المنتج الجديد | العد التنازلي</title>
    
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>نحن بصدد إطلاق شيء استثنائي</h1>
    <p>انضم إلينا في رحلة الابتكار القادمة</p>
</header>

<div class="container">
    <div class="timer-grid" id="countdown">
        <div class="timer-box"><span class="timer-val" id="days">00</span><span class="timer-label">يوم</span></div>
        <div class="timer-box"><span class="timer-val" id="hours">00</span><span class="timer-label">ساعة</span></div>
        <div class="timer-box"><span class="timer-val" id="minutes">00</span><span class="timer-label">دقيقة</span></div>
        <div class="timer-box"><span class="timer-val" id="seconds">00</span><span class="timer-label">ثانية</span></div>
    </div>

    <section class="section">
        <h2>جدول الفعالية</h2>
        <div class="agenda-item"><span class="time-badge">09:00 ص</span> <span>الاستقبال والترحيب</span></div>
        <div class="agenda-item"><span class="time-badge">10:00 ص</span> <span>كلمة الرئيس التنفيذي</span></div>
        <div class="agenda-item"><span class="time-badge">11:30 ص</span> <span>عرض المنتج الجديد</span></div>
    </section>

    <section class="section">
        <h2>اشترك للحصول على التحديثات</h2>
        <form class="subscribe-form" onsubmit="event.preventDefault(); alert('شكراً لاشتراكك!');">
            <input type="email" placeholder="أدخل بريدك الإلكتروني" required>
            <button type="submit">اشترك الآن</button>
        </form>
    </section>
</div>

<script>
    const targetDate = new Date().getTime() + (10 * 24 * 60 * 60 * 1000);

    function updateTimer() {
        const now = new Date().getTime();
        const diff = targetDate - now;

        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
        const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('days').innerText = d.toString().padStart(2, '0');
        document.getElementById('hours').innerText = h.toString().padStart(2, '0');
        document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
        document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
    }

    setInterval(updateTimer, 1000);
    updateTimer();
</script>

</body>
</html>
